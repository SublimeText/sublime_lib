[project]
name = "sublime_lib"
dynamic = ["version"]
description = "Utility library for frequently used functionality in Sublime Text"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "FichteFoll"}, {name = "Thom1729"}]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"

[build-system]
requires = ["hatchling>=1.20", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[dependency-groups]
lint = [
    "pydocstyle>=6.3.0",
    "ruff>=0.17.1",
    "sublime-text-stubs>=1.4200.0",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.*",
    "/stubs",
    "*.lock",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "sublime_lib/_version.py"
tag-pattern = "v{version}"

[tool.coverage.run]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true

[tool.pydocstyle]
match_dir = "^(?!_)"
match = "^(?!_).*\\.py"

[tool.ruff]
exclude = [
  ".git",
  ".github",
  "docs",
  "tests",
]
line-length = 100
target-version = "py38"
